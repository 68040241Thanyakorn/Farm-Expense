</header>


    <!-- ===== CONTENT ===== -->

      <!-- ข้อความเดิม ไม่เปลี่ยน -->

        แอปที่ช่วยเกษตรกรจัดการข้อมูลทางการเงินของฟาร์ม
        สามารถบันทึกรายรับ–รายจ่าย คำนวณกำไร–ขาดทุน

      </div>


      <!-- ข้อความเดิม -->

      </p>

      <!-- ปุ่มเดิม -->
      <button
        class="primary-button start-button"
        type="button"
        onclick="location.href = 'index3.html'"

        <span>เพิ่มบ่อและชนิดปลาถัดไป</span>

    <!-- ===== NAVIGATION BAR: 4 ปุ่มเดิม ===== -->
    <nav class="bottom-nav" aria-label="เมนูหลัก">

      <button

        type="button"

      <button

      >
        <span class="nav-icon">◎</span>

      </button>

    </nav>
  </main>

  <script>
    function openPondPage(page) {
      // อ่านข้อมูลบ่อปลาที่บันทึกไว้
      let ponds = [];

      try {
        ponds = JSON.parse(
          localStorage.getItem("farmExpensePonds") || "[]"
        );

        if (!Array.isArray(ponds)) {
          ponds = [];
        }
      } catch (error) {
        ponds = [];
      }

      // ยังไม่มีบ่อปลา
      if (ponds.length === 0) {
        alert("กรุณาเพิ่มบ่อปลาก่อนใช้งาน");

        location.href = "index3.html";
        return;
      }

      // ตรวจสอบบ่อที่เคยเลือกไว้
      const savedPondId = localStorage.getItem(
        "farmExpenseSelectedPond"
      );

      let selectedPond = ponds.find(
        (pond) =>
          String(pond.id ?? pond.pondNumber) ===
          String(savedPondId)
      );

      // หากยังไม่มีบ่อที่เลือกล่าสุด ให้เลือกบ่อแรก
      if (!selectedPond) {
        selectedPond = ponds[0];
      }

      const pondId =
        selectedPond.id ?? selectedPond.pondNumber;

      // บันทึกบ่อที่เลือก
      localStorage.setItem(
        "farmExpenseSelectedPond",
        String(pondId)
      );

      // เดือนปัจจุบัน
      const now = new Date();

      const month =
        now.getFullYear() +
        "-" +
        String(now.getMonth() + 1).padStart(2, "0");

      // เปิดหน้าสรุปผลหรือ AI
      const url = new URL(
        page + ".html",
        window.location.href
      );

      url.searchParams.set("pond", pondId);
      url.searchParams.set("month", month);

      location.href = url.href;
    }
  </script>
</body>

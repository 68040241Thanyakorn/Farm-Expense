<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Farm Expense" />
    <meta name="theme-color" content="#168b91" />

    <title>บันทึกรายรับ - Farm Expense</title>

    <link rel="stylesheet" href="./styles6.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <main class="app-page" style="--accent: #208f91">
      <header class="finance-header">
        <div class="pond-banner">
          <button
            class="back-link"
            type="button"
            onclick="goToPondDashboard()"
            aria-label="กลับ"
          >
            ❮
          </button>

          <img src="./Fish.png" alt="ปลา" />

          <strong id="pond-title">ข้อมูลบ่อปลา</strong>
        </div>

        <div class="header-meta">
          <select id="month-picker" aria-label="เลือกเดือน"></select>

          <div class="count-pill" id="fish-count">จำนวนปลา - ตัว</div>
        </div>
      </header>

      <section class="finance-content">
        <div class="entry-tabs">
          <a
            href="index6.html"
            id="income-tab"
            class="active"
            aria-current="page"
          >
            รายรับ
          </a>

          <a href="index7.html" id="expense-tab"> รายจ่าย </a>
        </div>

        <form class="entry-form" id="entry-form">
          <label for="category">ประเภท</label>

          <input
            id="category"
            name="category"
            list="category-options"
            placeholder="เช่น ขายปลา"
            required
            maxlength="100"
          />

          <datalist id="category-options">
            <option value="ขายปลา"></option>
            <option value="ขายลูกปลา"></option>
            <option value="รายรับอื่น ๆ"></option>
          </datalist>

          <label for="amount">จำนวนเงิน (บาท)</label>

          <input
            id="amount"
            name="amount"
            type="number"
            min="0.01"
            step="0.01"
            required
            placeholder="0.00"
          />

          <label for="date">วันที่</label>

          <input id="date" name="date" type="date" required />

          <label for="details">รายละเอียด (ถ้ามี)</label>

          <textarea
            id="details"
            name="details"
            maxlength="500"
            placeholder="รายละเอียดเพิ่มเติม"
          ></textarea>

          <p id="error" class="error" role="status" aria-live="polite"></p>

          <button class="submit-btn" type="submit">บันทึก</button>
        </form>
      </section>

      <nav class="bottom-nav" aria-label="เมนูหลัก">
        <a class="nav-item" href="index2.html">
          <span class="nav-icon">⌂</span>
          <span>หน้าหลัก</span>
        </a>

        <a class="nav-item" href="index4.html">
          <span class="nav-icon">▤</span>
          <span>รายการบ่อ</span>
        </a>

        <a class="nav-item" id="nav-summary" href="index8.html">
          <span class="nav-icon">▥</span>
          <span>สรุปผล</span>
        </a>

        <a class="nav-item" id="nav-ai" href="index9.html">
          <span class="nav-icon">◎</span>
          <span>AI</span>
        </a>
      </nav>
    </main>

    <script src="./finance.js"></script>

    <script>
      function getPondId() {
        const params = new URLSearchParams(location.search);

        return (
          params.get("pond") || localStorage.getItem("farmExpenseSelectedPond")
        );
      }

      function pageLink(page) {
        const params = new URLSearchParams(location.search);
        const pondId = getPondId();

        const picker = document.getElementById("month-picker");
        const month = picker?.value || params.get("month");

        const url = new URL(page + ".html", location.href);

        if (pondId) {
          url.searchParams.set("pond", pondId);
        }

        if (month) {
          url.searchParams.set("month", month);
        }

        return url.href;
      }

      function goToPondDashboard() {
        location.href = pageLink("index5");
      }

      if (setup()) {
        const picker = document.getElementById("month-picker");
        const dateInput = document.getElementById("date");
        const currentPondId = getPondId();

        if (currentPondId) {
          localStorage.setItem("farmExpenseSelectedPond", currentPondId);
        }

        function updateNavigation() {
          document.getElementById("nav-summary").href = pageLink("index8");

          document.getElementById("nav-ai").href = pageLink("index9");

          document.getElementById("income-tab").href = pageLink("index6");

          document.getElementById("expense-tab").href = pageLink("index7");
        }

        function updateDefaultDate() {
          const now = new Date();

          const today =
            now.getFullYear() +
            "-" +
            String(now.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(now.getDate()).padStart(2, "0");

          const selectedMonth = picker.value;

          if (!selectedMonth) {
            dateInput.value = today;
            return;
          }

          dateInput.value =
            selectedMonth === today.slice(0, 7) ? today : selectedMonth + "-01";
        }

        updateNavigation();
        updateDefaultDate();

        picker.addEventListener("change", () => {
          updateNavigation();
          updateDefaultDate();
        });

        saveEntry("income");
      }
    </script>
  </body>
</html>

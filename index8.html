<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Farm Expense" />
    <meta name="theme-color" content="#168b91" />

    <title>สรุปผล - Farm Expense</title>

    <link rel="stylesheet" href="./styles8.css" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <main class="app-page">
      <header class="page-head">
        <h1>สรุปผล</h1>
      </header>

      <section class="scroll-content">
        <div class="tabs" role="tablist" aria-label="ประเภทสรุปผล">
          <button
            type="button"
            class="tab active"
            data-tab="monthly"
            aria-selected="true"
          >
            รายเดือน
          </button>

          <button
            type="button"
            class="tab"
            data-tab="income-expense"
            aria-selected="false"
          >
            รายรับ–รายจ่าย
          </button>

          <button
            type="button"
            class="tab"
            data-tab="categories"
            aria-selected="false"
          >
            ค่าใช้จ่าย
          </button>
        </div>

        <div class="filters">
          <select id="month-picker" aria-label="เลือกเดือน"></select>

          <select id="pond-picker" aria-label="เลือกบ่อปลา"></select>
        </div>

        <div class="muted pond-description" id="pond-title">
          ข้อมูลทุกบ่อรวมกัน
        </div>

        <div class="summary-grid">
          <div class="metric income">
            รายรับ
            <strong id="income">0</strong>
            บาท
          </div>

          <div class="metric expense">
            รายจ่าย
            <strong id="expense">0</strong>
            บาท
          </div>

          <div class="metric profit">
            กำไร/ขาดทุน
            <strong id="profit">0</strong>
            บาท
          </div>
        </div>

        <div class="panel" id="monthly-panel">
          <h2 id="chart-title">กำไร–ขาดทุนรายเดือน</h2>

          <div class="legend">
            <span> <i class="dot income-dot"></i>รายรับ </span>

            <span> <i class="dot expense-dot"></i>รายจ่าย </span>
          </div>

          <div class="chart">
            <div class="yaxis" id="yaxis"></div>
            <div class="plot" id="monthly-chart"></div>
          </div>

          <p class="muted" id="monthly-note"></p>
        </div>

        <div class="panel" id="category-panel">
          <h2>สัดส่วนค่าใช้จ่าย</h2>

          <div class="donut-wrap">
            <div
              class="donut"
              id="expense-donut"
              role="img"
              aria-label="กราฟสัดส่วนค่าใช้จ่าย"
            ></div>

            <div class="category-list" id="category-list"></div>
          </div>
        </div>
      </section>

      <nav class="bottom-nav" aria-label="เมนูหลัก">
        <a class="nav-item" href="index2.html">
          <span class="nav-icon">⌂</span>
          <span>หน้าหลัก</span>
        </a>

        <a class="nav-item" href="index4.html">
          <span class="nav-icon">▤</span>
          <span>รายการบ่อ</span>
        </a>

        <a class="nav-item active" href="index8.html" aria-current="page">
          <span class="nav-icon">▥</span>
          <span>สรุปผล</span>
        </a>

        <a class="nav-item" id="nav-ai" href="index9.html">
          <span class="nav-icon">◎</span>
          <span>AI</span>
        </a>
      </nav>
    </main>

    <script src="./summary.js"></script>
  </body>
</html>
